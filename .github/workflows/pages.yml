name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages is serving from the gh-pages branch, so this pushes there and GitHub's
# own "pages build and deployment" job publishes it. Enabling the Actions-source
# mode instead would need repo-admin rights the workflow token doesn't have.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only the files the app actually serves — no README, tests or tooling.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html src icons manifest.webmanifest sw.js _site/

      # gh-pages holds no history worth keeping: each deploy is a fresh single
      # commit, so the branch never accumulates copies of the whole app.
      - name: Publish to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
